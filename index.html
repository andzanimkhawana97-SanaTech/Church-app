<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFM Protea North Paraklysis Worship Centre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
        }
        .bg-slate-950 { background-color: #020617; }
        .bg-slate-900 { background-color: #0f172a; }
        .selection-red ::selection { background-color: rgba(239, 68, 68, 0.3); color: white; }
        html { scroll-behavior: smooth; }
        
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.8s ease-out forwards; }
        
        .text-gradient {
            background: linear-gradient(to right, #60a5fa, #ffffff, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="selection-red">
    <div id="root">
        <div style="min-h-screen; display: flex; align-items: center; justify-content: center; background: #020617; color: white; font-family: sans-serif;">
            <div style="text-align: center;">
                <h2 style="margin-bottom: 10px;">AFM Protea North</h2>
                <p style="opacity: 0.5;">Loading Paraklysis Worship Centre...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        /** 
         * Error Handling for Pitch Presentation 
         */
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error(msg, url, lineNo, columnNo, error);
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = '<div style="color: white; padding: 20px; text-align: center;"><h1>Something went wrong</h1><p>' + msg + '</p></div>';
            }
            return false;
        };

        const { useState, useEffect } = React;

        // --- Icons ---
        const ChurchIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 7 4 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9l4-2"/><path d="M14 22v-4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"/><path d="m18 7-5-4a2 2 0 0 0-2 0L6 7"/><path d="M12 7v5"/></svg>
        );
        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        );
        const CalendarIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        );
        const MapPinIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        );
        const ClockIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );

        const BookmarkIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
        );

        const ShareIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
        );

        // --- Components ---

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isOpen, setIsOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b ${isScrolled ? 'bg-[#020617]/90 backdrop-blur-lg border-white/10 py-3' : 'bg-transparent border-transparent py-5'}`}>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-gradient-to-br from-red-600 to-blue-700 p-2 rounded-xl shadow-lg">
                                    <ChurchIcon />
                                </div>
                                <div className="flex flex-col leading-tight">
                                    <span className="text-xl font-black tracking-tighter text-white uppercase italic leading-none">AFM</span>
                                    <span className="text-[10px] font-bold text-red-500 uppercase tracking-widest leading-none mt-0.5">Protea North</span>
                                </div>
                            </div>
                            <div className="hidden md:flex items-center space-x-8">
                                {['Home', 'About', 'Announcements', 'Sermons', 'Events', 'Bible', 'Groups', 'Prayer', 'Give'].map((item) => (
                                    <a key={item} href={`#${item.toLowerCase()}`} className="text-slate-300 hover:text-white text-sm font-semibold transition-colors">
                                        {item}
                                    </a>
                                ))}
                                <button className="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-red-600/20 transition-all active:scale-95">
                                    Join Us
                                </button>
                            </div>
                            <button className="md:hidden text-white transition-transform active:scale-90" onClick={() => setIsOpen(!isOpen)}>
                                {isOpen ? (
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                ) : (
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                                )}
                            </button>
                        </div>
                    </div>
                    {/* Mobile Menu Overlay */}
                    <div className={`md:hidden absolute w-full bg-[#020617] border-b border-white/10 transition-all duration-300 ease-in-out overflow-hidden ${isOpen ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0'}`}>
                        <div className="px-4 pt-4 pb-8 space-y-2">
                            {['Home', 'About', 'Announcements', 'Sermons', 'Events', 'Bible', 'Groups', 'Prayer', 'Give'].map((item) => (
                                <a 
                                    key={item} 
                                    href={`#${item.toLowerCase()}`} 
                                    className="block text-slate-300 hover:text-white text-lg font-bold py-3 transition-colors border-b border-white/5 last:border-0"
                                    onClick={() => setIsOpen(false)}
                                >
                                    {item}
                                </a>
                            ))}
                            <button className="w-full mt-6 bg-red-600 hover:bg-red-700 text-white py-4 rounded-2xl font-black shadow-lg shadow-red-600/20">
                                Join Us Now
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section id="home" className="relative min-h-screen flex items-center justify-center overflow-hidden pt-16">
                <div className="absolute inset-0 z-0">
                    <img src="https://images.unsplash.com/photo-1438232992991-995b7058bbb3?auto=format&fit=crop&q=80&w=2000" className="w-full h-full object-cover opacity-40" />
                    <div className="absolute inset-0 bg-gradient-to-b from-[#020617]/80 via-[#020617]/70 to-[#020617]" />
                </div>
                <div className="relative z-10 max-w-7xl mx-auto px-4 text-center animate-fade-in-up">
                    <span className="inline-block px-4 py-1.5 mb-8 text-xs font-bold tracking-[0.2em] text-red-400 uppercase bg-red-400/10 border border-red-400/20 rounded-full">
                        Welcome to AFM Protea North Paraklysis Worship Centre
                    </span>
                    <h1 className="text-4xl sm:text-6xl md:text-8xl lg:text-9xl font-black mb-8 tracking-tighter leading-[0.9] text-white">
                        FAITH THAT <br />
                        <span className="text-gradient">TRANSFORMS</span>
                    </h1>
                    <p className="max-w-2xl mx-auto text-lg md:text-xl text-slate-400 mb-10 leading-relaxed font-medium">
                        Join our vibrant community as we seek to spread the Gospel, 
                        cultivate spiritual growth, and serve our neighbors with love.
                    </p>
                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                        <button className="w-full sm:w-auto px-10 py-5 bg-white text-slate-950 font-black rounded-2xl flex items-center justify-center gap-2 hover:bg-slate-200 transition-all shadow-xl">
                            Watch Live <PlayIcon />
                        </button>
                        <button className="w-full sm:w-auto px-10 py-5 bg-slate-900/50 border border-white/10 text-white font-black rounded-2xl flex items-center justify-center gap-2 hover:bg-slate-800 transition-all">
                            Our Ministries
                        </button>
                    </div>
                </div>
            </section>
        );

        const Mission = () => (
            <section id="about" className="py-32 bg-[#020617]">
                <div className="max-w-7xl mx-auto px-4">
                    <div className="text-center mb-20">
                        <h2 className="text-blue-500 font-black tracking-[0.3em] uppercase text-xs mb-4">Our Core Mission</h2>
                        <h3 className="text-4xl md:text-6xl font-black text-white leading-tight">Rooted in Word, <br/><span className="text-slate-600">Driven by Passion.</span></h3>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
                        {[
                            { title: 'Spiritual Growth', icon: 'zap', color: 'text-blue-400', bg: 'bg-blue-400/10' },
                            { title: 'Community Care', icon: 'heart', color: 'text-red-400', bg: 'bg-red-400/10' },
                            { title: 'Global Outreach', icon: 'globe', color: 'text-blue-400', bg: 'bg-blue-400/10' },
                            { title: 'Unity in Faith', icon: 'users', color: 'text-red-400', bg: 'bg-red-400/10' }
                        ].map((m, i) => (
                            <div key={i} className="p-8 md:p-10 rounded-[2rem] md:rounded-[2.5rem] bg-slate-900/30 border border-white/5 hover:border-white/10 transition-all group">
                                <div className={`w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center mb-6 md:mb-8 ${m.bg} ${m.color} group-hover:scale-110 transition-transform`}>
                                    <span className="uppercase font-bold text-xs">{m.icon}</span>
                                </div>
                                <h4 className="text-xl md:text-2xl font-black text-white mb-4">{m.title}</h4>
                                <p className="text-slate-400 text-sm md:text-base leading-relaxed font-medium">Nurturing faith and spreading hope to every soul through the power of Christ.</p>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Sermon = () => (
            <section id="sermons" className="py-32 bg-[#020617]">
                <div className="max-w-7xl mx-auto px-4">
                    <div className="relative rounded-[4rem] overflow-hidden bg-slate-900 border border-white/10 flex flex-col lg:flex-row group shadow-2xl">
                        <div className="lg:w-1/2 aspect-video lg:aspect-auto bg-slate-800 relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000 opacity-70" />
                            <div className="absolute inset-0 flex items-center justify-center">
                                <button className="w-24 h-24 rounded-full bg-red-600 flex items-center justify-center shadow-2xl shadow-red-600/50 hover:scale-110 transition-all">
                                    <PlayIcon />
                                </button>
                            </div>
                        </div>
                        <div className="lg:w-1/2 p-10 md:p-20 flex flex-col justify-center">
                            <span className="text-blue-400 font-black uppercase text-xs tracking-widest mb-6 flex items-center gap-2">
                                <span className="w-2 h-2 bg-red-600 rounded-full animate-pulse" /> Latest Message
                            </span>
                            <h2 className="text-4xl md:text-5xl lg:text-6xl font-black text-white mb-8 leading-tight">Walking in Grace</h2>
                            <p className="text-slate-400 mb-10 text-xl font-medium leading-relaxed">Experience a powerful message from Pastor Mudau about the transformative power of God's love.</p>
                            <div className="flex items-center gap-4 text-slate-300 mb-12">
                                <div className="w-12 h-12 rounded-full bg-gradient-to-br from-red-600 to-blue-600 flex items-center justify-center font-bold text-white shadow-lg">PM</div>
                                <div>
                                    <div className="font-black text-white">Pastor Mudau</div>
                                    <div className="text-xs font-bold text-slate-500 uppercase tracking-widest">Main Sanctuary</div>
                                </div>
                            </div>
                            <button className="w-full sm:w-max px-12 py-5 bg-white text-slate-950 font-black rounded-2xl hover:bg-slate-200 transition-all">Watch Full Sermon</button>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Events = () => (
            <section id="events" className="py-32 bg-[#020617]/50">
                <div className="max-w-7xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row items-end justify-between mb-16 gap-6">
                        <div>
                            <h2 className="text-red-500 font-black tracking-[0.3em] uppercase text-xs mb-4">Upcoming Gatherings</h2>
                            <h3 className="text-4xl md:text-5xl font-black text-white">Join Our Community</h3>
                        </div>
                        <button className="text-blue-400 font-bold hover:text-blue-300 flex items-center gap-2 uppercase tracking-widest text-xs">
                            Full Calendar <CalendarIcon />
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {[
                            { title: 'Sunday Worship', time: '09:00 AM', loc: 'Main Sanctuary', img: 'https://images.unsplash.com/photo-1544427920-c49ccfb85579?auto=format&fit=crop&w=800' },
                            { title: 'Youth Revival', time: '07:00 PM', loc: 'Youth Center', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800' },
                            { title: 'Bible Study', time: '06:30 PM', loc: 'Grace Hall', img: 'https://images.unsplash.com/photo-1507434965515-61970f2bd7c6?auto=format&fit=crop&w=800' }
                        ].map((e, i) => (
                            <div key={i} className="group rounded-[2.5rem] bg-slate-900/50 border border-white/5 overflow-hidden hover:border-red-500/30 transition-all">
                                <div className="aspect-[16/10] overflow-hidden">
                                    <img src={e.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                </div>
                                <div className="p-8">
                                    <h4 className="text-2xl font-black text-white mb-6">{e.title}</h4>
                                    <div className="space-y-4 mb-8">
                                        <div className="flex items-center gap-3 text-slate-400 text-sm font-bold">
                                            <ClockIcon /> {e.time}
                                        </div>
                                        <div className="flex items-center gap-3 text-slate-400 text-sm font-bold">
                                            <MapPinIcon /> {e.loc}
                                        </div>
                                    </div>
                                    <button className="w-full py-4 border border-white/10 rounded-2xl text-white font-bold group-hover:bg-white group-hover:text-slate-950 transition-all">Register Now</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Give = () => (
            <section id="give" className="py-32 bg-[#020617] relative overflow-hidden">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-red-600/5 rounded-full blur-[120px] pointer-events-none" />
                <div className="max-w-7xl mx-auto px-4 relative z-10 text-center">
                    <div className="bg-gradient-to-br from-slate-900 to-slate-950 border border-white/10 rounded-[4rem] p-12 md:p-24 shadow-2xl">
                        <div className="inline-flex items-center justify-center w-24 h-24 rounded-full bg-red-600/10 mb-10">
                            <span className="text-4xl">🎁</span>
                        </div>
                        <h2 className="text-4xl md:text-7xl font-black text-white mb-8 tracking-tight">GIVING BACK TO <br/><span className="text-blue-500">GOD'S MISSION</span></h2>
                        <p className="max-w-3xl mx-auto text-slate-400 text-xl font-medium mb-12 leading-relaxed">
                            Your generosity enables us to reach more souls and support our local community. 
                            Every contribution makes a eternal difference.
                        </p>
                        <button className="px-16 py-6 bg-red-600 hover:bg-red-700 text-white font-black rounded-[2rem] transition-all shadow-2xl shadow-red-600/30 active:scale-95 text-lg">
                            Support Our Mission
                        </button>
                        <p className="mt-12 text-slate-500 text-sm italic font-medium max-w-xl mx-auto">
                            "Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver." <br/>— 2 Corinthians 9:7
                        </p>
                    </div>
                </div>
            </section>
        );

        const Newsletter = () => (
            <section className="py-32 bg-[#020617]">
                <div className="max-w-7xl mx-auto px-4">
                        <div className="bg-gradient-to-r from-blue-900/10 to-red-900/10 border border-white/5 rounded-[2rem] md:rounded-[3rem] p-8 md:p-20 relative overflow-hidden text-center md:text-left">
                        <div className="max-w-2xl relative z-10">
                            <h2 className="text-2xl md:text-5xl font-black text-white mb-6">Stay Connected</h2>
                            <p className="text-slate-400 text-base md:text-xl mb-8 md:text-10 font-medium">Receive weekly updates and sermon notes directly in your inbox.</p>
                            <div className="flex flex-col sm:flex-row gap-3 md:gap-4">
                                <input type="email" placeholder="Enter your email" className="flex-1 bg-slate-950 border border-white/10 rounded-xl md:rounded-2xl px-6 md:px-8 py-4 md:py-5 text-white focus:outline-none focus:border-red-500 transition-colors font-bold text-sm md:text-base" />
                                <button className="bg-white text-slate-950 font-black px-8 md:px-10 py-4 md:py-5 rounded-xl md:rounded-2xl transition-all hover:bg-slate-200 shadow-xl text-sm md:text-base">Subscribe</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="bg-[#020617] border-t border-white/5 pt-32 pb-16">
                <div className="max-w-7xl mx-auto px-4">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-16 mb-20 text-center md:text-left">
                        <div className="col-span-1 md:col-span-1">
                            <div className="flex items-center gap-3 mb-8 justify-center md:justify-start">
                                <div className="bg-red-600 p-2 rounded-xl"><ChurchIcon /></div>
                                <div className="flex flex-col leading-tight">
                                    <span className="text-2xl font-black tracking-tighter text-white uppercase italic">AFM</span>
                                    <span className="text-[10px] font-bold text-red-500 uppercase tracking-widest mt-0.5">Protea North</span>
                                </div>
                            </div>
                            <p className="text-slate-400 font-medium leading-relaxed">Paraklysis Worship Centre. Reaching souls, changing lives, and building the Kingdom of God.</p>
                        </div>
                        <div>
                            <h4 className="text-white font-black uppercase text-xs tracking-widest mb-8">Quick Links</h4>
                            <ul className="space-y-4 font-bold text-sm">
                                {['Home', 'About Us', 'Ministries', 'Sermons'].map(l => (
                                    <li key={l}><a href="#" className="text-slate-500 hover:text-white transition-colors">{l}</a></li>
                                ))}
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-black uppercase text-xs tracking-widest mb-8">Resources</h4>
                            <ul className="space-y-4 font-bold text-sm">
                                {['Live Stream', 'Bible Study', 'Volunteering', 'Prayer'].map(l => (
                                    <li key={l}><a href="#" className="text-slate-500 hover:text-white transition-colors">{l}</a></li>
                                ))}
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-black uppercase text-xs tracking-widest mb-8">Contact</h4>
                            <ul className="space-y-6">
                                <li className="flex items-start gap-4 text-slate-400 justify-center md:justify-start">
                                    <MapPinIcon className="text-red-500 shrink-0" />
                                    <span className="font-bold text-sm">Mdlalose St, Protea North, Johannesburg, 1818</span>
                                </li>
                                <li className="flex items-center gap-4 text-slate-400 justify-center md:justify-start">
                                    <ClockIcon className="text-red-500 shrink-0" />
                                    <span className="font-bold text-sm">Sun: 09:00 AM - 12:00 PM</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="pt-10 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 text-slate-600 font-bold text-xs uppercase tracking-widest">
                        <p>© 2025 Apostolic Faith Mission. All rights reserved.</p>
                        <div className="flex gap-8">
                            <a href="#" className="hover:text-white transition-colors">Privacy</a>
                            <a href="#" className="hover:text-white transition-colors">Terms</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const Announcements = () => (
            <section id="announcements" className="py-24 bg-[#020617]">
                <div className="max-w-7xl mx-auto px-4">
                    <div className="flex items-center gap-4 mb-12">
                        <div className="h-px flex-1 bg-gradient-to-r from-transparent to-red-600/50"></div>
                        <h2 className="text-red-500 font-black tracking-[0.3em] uppercase text-xs">Latest Announcements</h2>
